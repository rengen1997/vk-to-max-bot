name: VK to MAX Crossposter

on:
  schedule:
    # Автоматический запуск каждые 10 минут круглосуточно
    - cron: '*/10 * * * *'
  workflow_dispatch: # Добавляет кнопку ручного запуска в один клик

permissions:
  contents: write

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка библиотек
        run: pip install requests urllib3

      - name: Проверка новых постов ВК и отправка в MAX
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: python cross_poster.py

      - name: Сохранение номера последнего поста
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "Update VK event state"
          git push
